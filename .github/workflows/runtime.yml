name: Runtime

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    name: Host (C++${{ matrix.standard }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        standard: [20, 23]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DDMC_RENGINE_BUILD_TESTS=ON
          -DDMC_RENGINE_BUILD_RUNTIME=ON
          -DDMC_RENGINE_RUNTIME_CXX_STANDARD=${{ matrix.standard }}

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test runtime layer
        run: ctest --test-dir build -C Release --output-on-failure -R "runtime_(status|frame_clock|headless_platform|render_backend|resource_bridge|stage_host|application)_tests|runtime_probe"

      - name: Report runtime build
        run: cmake --build build --config Release --target dmc-rengine-runtime-probe

  forward-looking:
    # C++26 is not a gate: it runs where the toolchain has it and is expected
    # to be skipped elsewhere. The runtime downgrades to C++23 on its own.
    name: Host (C++26, forward-looking)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DDMC_RENGINE_BUILD_TESTS=ON
          -DDMC_RENGINE_RUNTIME_CXX_STANDARD=26

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test runtime layer
        run: ctest --test-dir build --output-on-failure -R "runtime_(status|frame_clock|headless_platform|render_backend|resource_bridge|stage_host|application)_tests|runtime_probe"

  android:
    name: Android (arm64-v8a, x86_64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: dmc-rengine-runtime-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
