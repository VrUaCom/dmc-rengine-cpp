name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    if: github.head_ref != 'ci/native-reader-android-toolchain'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Validate reverse acquisition packet plan
        run: python scripts/reverse/extract_exe_window_packet.py --plan data/reverse/dmc3-gdspaces-blocked-window-plan.v1.json --validate-plan-only
      - name: Validate focused materialization completion plan
        run: python scripts/reverse/extract_exe_window_packet.py --plan data/reverse/dmc3-materialization-completion-boundary-plan.v1.json --validate-plan-only
      - name: Test reverse acquisition packet guardrails
        run: python scripts/reverse/test_extract_exe_window_packet.py
      - name: Test L2 runtime mapping packet guardrails
        run: python scripts/reverse/test_verify_l2_runtime_mapping_packet.py
      - name: Test L2 process-instance mapping v2 guardrails
        run: python scripts/reverse/test_verify_l2_runtime_mapping_packet_v2.py
      - name: Test L2 legacy selection candidate normalization
        run: python scripts/reverse/test_normalize_l2_original_selection_candidate.py
      - name: Test L2 original selection evidence guardrails
        run: python scripts/reverse/test_verify_l2_original_selection_evidence.py
      - name: Configure
        run: cmake -S . -B build -DDMC_RENGINE_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Publish Ubuntu CLI evidence artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: dmc-rengine-linux-${{ github.sha }}
          path: build/dmc-rengine
          if-no-files-found: error

  native-reader-android-toolchain:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: android-actions/setup-android@v3

      - name: Install Native Reader toolchain
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Pack and split Android SDK/NDK slice
        run: |
          set -euxo pipefail
          SDK="$ANDROID_SDK_ROOT"
          NDK="$SDK/ndk/28.2.13676358"
          OUT="$RUNNER_TEMP/dmc-android-toolchain"
          mkdir -p "$OUT/sdk/platforms/android-36" "$OUT/sdk/build-tools/36.0.0" "$OUT/ndk"
          cp "$SDK/platforms/android-36/android.jar" "$OUT/sdk/platforms/android-36/"
          cp -a "$SDK/build-tools/36.0.0/." "$OUT/sdk/build-tools/36.0.0/"
          cp "$NDK/source.properties" "$OUT/ndk/"
          cp -a "$NDK/build" "$OUT/ndk/"
          cp -a "$NDK/toolchains" "$OUT/ndk/"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/dmc-android-toolchain-r28c.tar.gz" dmc-android-toolchain
          split -b 300M -d -a 1 \
            "$RUNNER_TEMP/dmc-android-toolchain-r28c.tar.gz" \
            "$RUNNER_TEMP/dmc-android-toolchain-r28c.part-"
          test -f "$RUNNER_TEMP/dmc-android-toolchain-r28c.part-0"
          test -f "$RUNNER_TEMP/dmc-android-toolchain-r28c.part-1"
          test -f "$RUNNER_TEMP/dmc-android-toolchain-r28c.part-2"
          ls -lh "$RUNNER_TEMP"/dmc-android-toolchain-r28c.part-*

      - uses: actions/upload-artifact@v4
        with:
          name: dmc-android-toolchain-r28c-part-0
          path: ${{ runner.temp }}/dmc-android-toolchain-r28c.part-0
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: dmc-android-toolchain-r28c-part-1
          path: ${{ runner.temp }}/dmc-android-toolchain-r28c.part-1
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: dmc-android-toolchain-r28c-part-2
          path: ${{ runner.temp }}/dmc-android-toolchain-r28c.part-2
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
