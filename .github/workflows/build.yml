name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Test reverse acquisition packet guardrails
        run: python scripts/reverse/test_extract_exe_window_packet.py
      - name: Test executable-reverse SQL importer guardrails
        run: python research/sql/test_import_executable_reverse.py
      - name: Evidence figure checker guardrails
        run: python research/sql/test_check_evidence_figures.py
      - name: Record decoder extractor guardrails
        run: python research/exe/test_extract_record_decoders.py
      - name: Closure gap measurement guardrails
        run: python research/exe/test_measure_closure_gaps.py
      - name: Configure
        run: cmake -S . -B build -DDMC_RENGINE_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Validate reverse acquisition packet plans
        shell: bash
        run: |
          cli=build/dmc-rengine
          [ -x "$cli" ] || cli=build/Release/dmc-rengine.exe
          for plan in \
            data/reverse/dmc3-gdspaces-blocked-window-plan.v1.json \
            data/reverse/dmc3-materialization-completion-boundary-plan.v1.json \
            data/reverse/dmc3-mot-local-matrix-window-plan.v1.json \
            data/reverse/dmc3-scm-deep-reader-window-plan.v1.json; do
            "$cli" extract-exe-window-packet --plan "$plan" --validate-plan-only
          done
      - name: Publish Ubuntu CLI evidence artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: dmc-rengine-linux-${{ github.sha }}
          path: build/dmc-rengine
          if-no-files-found: error
