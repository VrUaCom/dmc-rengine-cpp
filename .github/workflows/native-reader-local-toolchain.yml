name: Native Reader local toolchain bridge

on:
  push:
    branches:
      - integrate/native-reader-texture-core-20260908

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Prepare ReaderCore source snapshot
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/reader-core
          cp -R include /tmp/reader-core/include
          mkdir -p /tmp/reader-core/cmake
          cp cmake/reader_core.cmake /tmp/reader-core/cmake/
          while read -r path; do
            mkdir -p "/tmp/reader-core/$(dirname "$path")"
            cp "$path" "/tmp/reader-core/$path"
          done <<'EOF'
          src/binary/reader.cpp
          src/codecs/dds_bc.cpp
          src/profiles/dmc3/texture_slot_framing.cpp
          src/formats/mod_skin.cpp
          src/formats/mod/transform_domain.cpp
          src/formats/mod/world_transform.cpp
          src/formats/mod.cpp
          src/formats/scm_layout.cpp
          src/formats/scm_topology.cpp
          src/formats/scm_validation.cpp
          src/formats/scm_transform.cpp
          src/formats/scm_hierarchy.cpp
          src/formats/scm.cpp
          src/formats/scm_internal.hpp
          EOF
          cd /tmp
          zip -qr reader-core-source.zip reader-core

      - name: Fetch pinned Android NDK r28c
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o /tmp/android-ndk-r28c-linux.zip \
            https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          echo 'a7b54a5de87fecd125a17d54f73c446199e72a64  /tmp/android-ndk-r28c-linux.zip' | sha1sum -c -

      - name: Package Android build tools
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'build-tools;36.0.0'
          cd "$ANDROID_SDK_ROOT"
          zip -qr /tmp/android-build-tools-36.0.0.zip build-tools/36.0.0

      - uses: actions/upload-artifact@v4
        with:
          name: dmc-reader-core-source
          path: /tmp/reader-core-source.zip
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: android-ndk-r28c-linux
          path: /tmp/android-ndk-r28c-linux.zip
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-36.0.0
          path: /tmp/android-build-tools-36.0.0.zip
          if-no-files-found: error
          retention-days: 1
