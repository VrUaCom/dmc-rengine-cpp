name: LSG Windows Prototype

on:
  push:
    branches: [rengine-living-surface-genome]
    paths: ['labs/lsg/**', '.github/workflows/lsg-windows.yml']
  pull_request:
    paths: ['labs/lsg/**', '.github/workflows/lsg-windows.yml']

env:
  LSG_BASE_HUMAN_URL: https://raw.githubusercontent.com/makehumancommunity/makehuman/a8bc2d54ff0ac92e78ff71431b1023eda42bf482/makehuman/data/3dobjs/base.obj
  LSG_BASE_HUMAN_GIT_BLOB: d26635e9326e3cca30778fd7b9c00062b03cce09
  LSG_MALE_AFRICAN_URL: https://raw.githubusercontent.com/makehumancommunity/makehuman/a8bc2d54ff0ac92e78ff71431b1023eda42bf482/makehuman/data/targets/macrodetails/african-male-young.target
  LSG_MALE_AFRICAN_BLOB: dd5743e48700267d76596f575bf17b4b5cc3b3e0
  LSG_MALE_ASIAN_URL: https://raw.githubusercontent.com/makehumancommunity/makehuman/a8bc2d54ff0ac92e78ff71431b1023eda42bf482/makehuman/data/targets/macrodetails/asian-male-young.target
  LSG_MALE_ASIAN_BLOB: 8cd3ef3e9ddb06ee2d166f75f9ac10871251f938
  LSG_MALE_CAUCASIAN_URL: https://raw.githubusercontent.com/makehumancommunity/makehuman/a8bc2d54ff0ac92e78ff71431b1023eda42bf482/makehuman/data/targets/macrodetails/caucasian-male-young.target
  LSG_MALE_CAUCASIAN_BLOB: c3b82f92c5ced85599199cd184b0faf3b3fc6881
  LSG_FEMALE_AFRICAN_URL: https://raw.githubusercontent.com/makehumancommunity/makehuman/a8bc2d54ff0ac92e78ff71431b1023eda42bf482/makehuman/data/targets/macrodetails/african-female-young.target
  LSG_FEMALE_AFRICAN_BLOB: a7d2b130667cc81ecd1ca0598da9be27bec1864a
  LSG_FEMALE_ASIAN_URL: https://raw.githubusercontent.com/makehumancommunity/makehuman/a8bc2d54ff0ac92e78ff71431b1023eda42bf482/makehuman/data/targets/macrodetails/asian-female-young.target
  LSG_FEMALE_ASIAN_BLOB: f862c96add11c31ab1ca75c69e1c67ae5e0e3d5f
  LSG_FEMALE_CAUCASIAN_URL: https://raw.githubusercontent.com/makehumancommunity/makehuman/a8bc2d54ff0ac92e78ff71431b1023eda42bf482/makehuman/data/targets/macrodetails/caucasian-female-young.target
  LSG_FEMALE_CAUCASIAN_BLOB: 9d1f0cbeedc9a6a51abe33f1ebb5fa7c5a7edbf1
  LSG_FEMALE_BUST_URL: https://raw.githubusercontent.com/makehumancommunity/makehuman/a8bc2d54ff0ac92e78ff71431b1023eda42bf482/makehuman/data/targets/breast/female-young-averagemuscle-averageweight-maxcup-averagefirmness.target
  LSG_FEMALE_BUST_BLOB: 2ff890c95741f40211408ea507c15bec00051798
  LSG_EYE_OBJ_URL: https://raw.githubusercontent.com/makehumancommunity/makehuman/a8bc2d54ff0ac92e78ff71431b1023eda42bf482/makehuman/data/eyes/high-poly/high-poly.obj
  LSG_EYE_OBJ_BLOB: 01562a9caf4dca9ebb1fd5c24db083c17e724330
  LSG_EYE_MHCLO_URL: https://raw.githubusercontent.com/makehumancommunity/makehuman/a8bc2d54ff0ac92e78ff71431b1023eda42bf482/makehuman/data/eyes/high-poly/high-poly.mhclo
  LSG_EYE_MHCLO_BLOB: 22bc5f77f398c59088804f7f4c9bb0e39d38661d

jobs:
  windows-x64-vulkan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan SDK 1.4.350
        shell: pwsh
        run: |
          choco install vulkan-sdk --version=1.4.350 -y --no-progress
          $sdk = Get-ChildItem 'C:\VulkanSDK' -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw 'Vulkan SDK installation directory not found' }
          "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$($sdk.FullName)\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Configure C++23 Win32 Vulkan viewer and tools
        run: cmake -S labs/lsg -B build-lsg-win -G "Visual Studio 18 2026" -A x64
      - name: Build mesh/profile/report tools
        run: cmake --build build-lsg-win --config Release --target lsg_extract_obj_group lsg_apply_makehuman_targets lsg_fit_mhclo lsg_prepare_mesh lsg_merge_debug_mesh lsg_mesh_audit lsg_compile lsg_report --parallel 2
      - name: Prepare pinned male/female macro RMS0 assets and canonical genomes
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 3 $env:LSG_BASE_HUMAN_URL -o build-lsg-win\base.obj
          if ((git hash-object build-lsg-win\base.obj).Trim() -ne $env:LSG_BASE_HUMAN_GIT_BLOB) { throw 'Base Human blob mismatch' }

          curl.exe -L --fail --retry 3 $env:LSG_MALE_AFRICAN_URL -o build-lsg-win\male-african.target
          curl.exe -L --fail --retry 3 $env:LSG_MALE_ASIAN_URL -o build-lsg-win\male-asian.target
          curl.exe -L --fail --retry 3 $env:LSG_MALE_CAUCASIAN_URL -o build-lsg-win\male-caucasian.target
          curl.exe -L --fail --retry 3 $env:LSG_FEMALE_AFRICAN_URL -o build-lsg-win\female-african.target
          curl.exe -L --fail --retry 3 $env:LSG_FEMALE_ASIAN_URL -o build-lsg-win\female-asian.target
          curl.exe -L --fail --retry 3 $env:LSG_FEMALE_CAUCASIAN_URL -o build-lsg-win\female-caucasian.target
          curl.exe -L --fail --retry 3 $env:LSG_FEMALE_BUST_URL -o build-lsg-win\female-bust.target
          curl.exe -L --fail --retry 3 $env:LSG_EYE_OBJ_URL -o build-lsg-win\eye-high.obj
          curl.exe -L --fail --retry 3 $env:LSG_EYE_MHCLO_URL -o build-lsg-win\eye-high.mhclo

          if ((git hash-object build-lsg-win\male-african.target).Trim() -ne $env:LSG_MALE_AFRICAN_BLOB) { throw 'male African target mismatch' }
          if ((git hash-object build-lsg-win\male-asian.target).Trim() -ne $env:LSG_MALE_ASIAN_BLOB) { throw 'male Asian target mismatch' }
          if ((git hash-object build-lsg-win\male-caucasian.target).Trim() -ne $env:LSG_MALE_CAUCASIAN_BLOB) { throw 'male Caucasian target mismatch' }
          if ((git hash-object build-lsg-win\female-african.target).Trim() -ne $env:LSG_FEMALE_AFRICAN_BLOB) { throw 'female African target mismatch' }
          if ((git hash-object build-lsg-win\female-asian.target).Trim() -ne $env:LSG_FEMALE_ASIAN_BLOB) { throw 'female Asian target mismatch' }
          if ((git hash-object build-lsg-win\female-caucasian.target).Trim() -ne $env:LSG_FEMALE_CAUCASIAN_BLOB) { throw 'female Caucasian target mismatch' }
          if ((git hash-object build-lsg-win\female-bust.target).Trim() -ne $env:LSG_FEMALE_BUST_BLOB) { throw 'female bust target mismatch' }
          if ((git hash-object build-lsg-win\eye-high.obj).Trim() -ne $env:LSG_EYE_OBJ_BLOB) { throw 'eye OBJ blob mismatch' }
          if ((git hash-object build-lsg-win\eye-high.mhclo).Trim() -ne $env:LSG_EYE_MHCLO_BLOB) { throw 'eye MHClO blob mismatch' }

          & build-lsg-win\Release\lsg_apply_makehuman_targets.exe build-lsg-win\base.obj build-lsg-win\profile-0.obj `
            build-lsg-win\male-african.target 0.333333333333 `
            build-lsg-win\male-asian.target 0.333333333333 `
            build-lsg-win\male-caucasian.target 0.333333333334
          if ($LASTEXITCODE -ne 0) { throw 'male macro target application failed' }

          & build-lsg-win\Release\lsg_apply_makehuman_targets.exe build-lsg-win\base.obj build-lsg-win\profile-1-base.obj `
            build-lsg-win\female-african.target 0.333333333333 `
            build-lsg-win\female-asian.target 0.333333333333 `
            build-lsg-win\female-caucasian.target 0.333333333334
          if ($LASTEXITCODE -ne 0) { throw 'female macro target application failed' }

          & build-lsg-win\Release\lsg_apply_makehuman_targets.exe build-lsg-win\profile-1-base.obj build-lsg-win\profile-1.obj `
            build-lsg-win\female-bust.target 1.0
          if ($LASTEXITCODE -ne 0) { throw 'female bust target application failed' }

          New-Item -ItemType Directory -Force build-lsg-win\Release\meshes | Out-Null
          foreach ($profile in 0,1) {
            $carrier = if ($profile -eq 0) { 'male' } else { 'female' }
            & build-lsg-win\Release\lsg_fit_mhclo.exe build-lsg-win\profile-$profile.obj build-lsg-win\eye-high.obj build-lsg-win\eye-high.mhclo build-lsg-win\profile-$profile-eyes.obj `
              | Tee-Object -FilePath build-lsg-win\lsg-profile-$profile-eye-fit-report.txt
            if ($LASTEXITCODE -ne 0 -or -not (Select-String -Path build-lsg-win\lsg-profile-$profile-eye-fit-report.txt -Pattern 'MHCL0 FIT PASS' -Quiet)) {
              throw "profile $profile eye fitting failed"
            }

            & build-lsg-win\Release\lsg_fit_mhclo.exe build-lsg-win\profile-$profile.obj build-lsg-win\eye-high.obj build-lsg-win\eye-high.mhclo build-lsg-win\profile-$profile-eyes-repeat.obj | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "profile $profile repeat eye fitting failed" }
            if ((Get-FileHash build-lsg-win\profile-$profile-eyes.obj).Hash -ne (Get-FileHash build-lsg-win\profile-$profile-eyes-repeat.obj).Hash) {
              throw "profile $profile eye fitting is not deterministic"
            }

            $vertexCount = (Select-String -Path build-lsg-win\profile-$profile-eyes.obj -Pattern '^v ').Count
            $uvCount = (Select-String -Path build-lsg-win\profile-$profile-eyes.obj -Pattern '^vt ').Count
            if ($vertexCount -ne 1064) { throw "profile $profile fitted eye vertex count mismatch: $vertexCount" }
            if ($uvCount -ne 808) { throw "profile $profile fitted eye UV count mismatch: $uvCount" }

            & build-lsg-win\Release\lsg_prepare_mesh.exe build-lsg-win\profile-$profile-eyes.obj build-lsg-win\Release\meshes\eye_carrier_$carrier.rmesh --component-regions `
              | Tee-Object -FilePath build-lsg-win\lsg-eye-components-profile-$profile.txt
            if ($LASTEXITCODE -ne 0) { throw "profile $profile eye RMS0 preparation failed" }
            if (-not (Select-String -Path build-lsg-win\lsg-eye-components-profile-$profile.txt -Pattern 'components=4' -Quiet)) {
              throw "profile $profile eye component count is not 4"
            }
            if (-not (Select-String -Path build-lsg-win\lsg-eye-components-profile-$profile.txt -Pattern 'SOURCE NORMAL SEAMS PASS' -Quiet)) {
              throw "profile $profile source-position normal seam gate missing"
            }
            if (-not (Select-String -Path build-lsg-win\lsg-eye-components-profile-$profile.txt -Pattern 'source_positions=1064' -Quiet)) {
              throw "profile $profile source-position count is not 1064"
            }

            & build-lsg-win\Release\lsg_prepare_mesh.exe build-lsg-win\profile-$profile-eyes.obj build-lsg-win\eye_profile_$profile-repeat.rmesh --component-regions | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "profile $profile repeat eye RMS0 preparation failed" }
            if ((Get-FileHash build-lsg-win\Release\meshes\eye_carrier_$carrier.rmesh).Hash -ne (Get-FileHash build-lsg-win\eye_profile_$profile-repeat.rmesh).Hash) {
              throw "profile $profile eye RMS0 preparation is not deterministic"
            }
          }
          if ((Get-FileHash build-lsg-win\profile-0-eyes.obj).Hash -eq (Get-FileHash build-lsg-win\profile-1-eyes.obj).Hash) {
            throw 'fitted eye outputs are unexpectedly identical across macro profiles'
          }
          @(
            "profile0 $((Get-FileHash build-lsg-win\profile-0-eyes.obj -Algorithm SHA256).Hash)"
            "profile1 $((Get-FileHash build-lsg-win\profile-1-eyes.obj -Algorithm SHA256).Hash)"
          ) | Set-Content build-lsg-win\lsg-eye-fit-sha256.txt

          New-Item -ItemType Directory -Force build-lsg-win\Release\meshes | Out-Null
          foreach ($profile in 0,1) {
            $carrier = if ($profile -eq 0) { 'male' } else { 'female' }
            & build-lsg-win\Release\lsg_extract_obj_group.exe build-lsg-win\profile-$profile.obj body build-lsg-win\profile-$profile-body.obj
            if ($LASTEXITCODE -ne 0) { throw "profile $profile body extraction failed" }
            & build-lsg-win\Release\lsg_prepare_mesh.exe build-lsg-win\profile-$profile-body.obj build-lsg-win\profile-$profile-body.rmesh | Tee-Object -FilePath build-lsg-win\Release\lsg-body-normal-seams-profile-$profile.txt
            if ($LASTEXITCODE -ne 0) { throw "profile $profile body RMS0 preparation failed" }
            if (-not (Select-String -Path build-lsg-win\Release\lsg-body-normal-seams-profile-$profile.txt -Pattern 'SOURCE NORMAL SEAMS PASS' -Quiet)) {
              throw "profile $profile body source-position normal seam gate missing"
            }
            if (-not (Select-String -Path build-lsg-win\Release\lsg-body-normal-seams-profile-$profile.txt -Pattern 'max_duplicate_normal_delta=0' -Quiet)) {
              throw "profile $profile body duplicate normal delta is non-zero"
            }
            & build-lsg-win\Release\lsg_mesh_audit.exe build-lsg-win\profile-$profile-body.rmesh `
              | Tee-Object -FilePath build-lsg-win\Release\lsg-mesh-audit-profile-$profile.txt
            if ($LASTEXITCODE -ne 0 -or -not (Select-String -Path build-lsg-win\Release\lsg-mesh-audit-profile-$profile.txt -Pattern 'LSG MESH CONTINUITY PASS' -Quiet)) {
              throw "profile $profile continuity audit failed"
            }

            & build-lsg-win\Release\lsg_extract_obj_group.exe build-lsg-win\profile-$profile.obj prefix:joint- build-lsg-win\profile-$profile-joints.obj
            if ($LASTEXITCODE -ne 0) { throw "profile $profile joint extraction failed" }
            & build-lsg-win\Release\lsg_prepare_mesh.exe build-lsg-win\profile-$profile-joints.obj build-lsg-win\profile-$profile-joints.rmesh
            if ($LASTEXITCODE -ne 0) { throw "profile $profile joint RMS0 preparation failed" }
            & build-lsg-win\Release\lsg_merge_debug_mesh.exe build-lsg-win\profile-$profile-body.rmesh build-lsg-win\profile-$profile-joints.rmesh `
              build-lsg-win\Release\meshes\human_carrier_$carrier.rmesh
            if ($LASTEXITCODE -ne 0) { throw "profile $profile debug merge failed" }
          }

          New-Item -ItemType Directory -Force build-lsg-win\Release\profiles | Out-Null
          & build-lsg-win\Release\lsg_compile.exe labs\lsg\assets\profiles\character_0.lsg.json build-lsg-win\Release\profiles\character_0.lsg
          & build-lsg-win\Release\lsg_compile.exe labs\lsg\assets\profiles\character_1.lsg.json build-lsg-win\Release\profiles\character_1.lsg
          & build-lsg-win\Release\lsg_compile.exe labs\lsg\assets\profiles\character_2_ada.lsg.json build-lsg-win\Release\profiles\character_2.lsg
          Copy-Item labs\lsg\assets\registry.lsgr build-lsg-win\Release\registry.lsgr -Force
          if (!(Test-Path 'build-lsg-win\Release\meshes\human_carrier_male.rmesh')) { throw 'Male carrier RMS0 missing' }
          if (!(Test-Path 'build-lsg-win\Release\meshes\human_carrier_female.rmesh')) { throw 'Female carrier RMS0 missing' }
          if (!(Test-Path 'build-lsg-win\Release\meshes\eye_carrier_male.rmesh')) { throw 'Male eye carrier RMS0 missing' }
          if (!(Test-Path 'build-lsg-win\Release\meshes\eye_carrier_female.rmesh')) { throw 'Female eye carrier RMS0 missing' }
          if ((Get-FileHash build-lsg-win\Release\meshes\human_carrier_male.rmesh).Hash -eq (Get-FileHash build-lsg-win\Release\meshes\human_carrier_female.rmesh).Hash) {
            throw 'macro profile meshes are unexpectedly identical'
          }
          if (!(Test-Path 'build-lsg-win\Release\profiles\character_0.lsg')) { throw 'Character 0 genome missing' }
          if (!(Test-Path 'build-lsg-win\Release\profiles\character_1.lsg')) { throw 'Character 1 genome missing' }
          if (!(Test-Path 'build-lsg-win\Release\profiles\character_2.lsg')) { throw 'Character 2 / Ada genome missing' }

      - name: Build tests and viewer
        run: cmake --build build-lsg-win --config Release --target rengine_lsg_tests lsg_shadow_filter_tests rengine_lsg_viewer --parallel 2
      - name: Run deterministic contract tests
        run: ctest --test-dir build-lsg-win -C Release --output-on-failure
      - name: Measure LSG storage contract
        shell: pwsh
        run: |
          & build-lsg-win\Release\lsg_report.exe `
            build-lsg-win\Release `
            build-lsg-win\Release\profiles\character_0.lsg `
            build-lsg-win\Release\profiles\character_1.lsg `
            build-lsg-win\Release\profiles\character_2.lsg `
            | Tee-Object -FilePath build-lsg-win\Release\lsg-acceptance-report.txt
          if ($LASTEXITCODE -ne 0) { throw 'LSG storage contract failed' }
          if (-not (Select-String -Path build-lsg-win\Release\lsg-acceptance-report.txt -Pattern 'LSG STORAGE CONTRACT PASS' -Quiet)) {
            throw 'LSG storage PASS marker missing'
          }
          if (-not (Select-String -Path build-lsg-win\Release\lsg-acceptance-report.txt -Pattern 'Built-in profile source parity: PASS' -Quiet)) {
            throw 'built-in/authoring profile parity marker missing'
          }
          if (-not (Select-String -Path build-lsg-win\Release\lsg-acceptance-report.txt -Pattern 'Shared skin material runtime bytes: 80' -Quiet)) {
            throw 'shared skin material runtime contract missing'
          }
          if (-not (Select-String -Path build-lsg-win\Release\lsg-acceptance-report.txt -Pattern 'Skin material shader family: shared' -Quiet)) {
            throw 'shared skin shader family marker missing'
          }
          if (-not (Select-String -Path build-lsg-win\Release\lsg-acceptance-report.txt -Pattern 'Profile-specific carrier duplicate bytes: 0' -Quiet)) {
            throw 'shared-carrier deduplication marker missing'
          }
      - name: Verify runnable Windows package
        shell: pwsh
        run: |
          if (!(Test-Path 'build-lsg-win\Release\rengine_lsg_viewer.exe')) { throw 'viewer exe missing' }
          if (!(Test-Path 'build-lsg-win\Release\shaders\human.vert.spv')) { throw 'vertex SPIR-V missing beside EXE' }
          if (!(Test-Path 'build-lsg-win\Release\shaders\human.frag.spv')) { throw 'fragment SPIR-V missing beside EXE' }
          if (!(Test-Path 'build-lsg-win\Release\meshes\human_carrier_male.rmesh')) { throw 'Male carrier RMS0 missing beside EXE' }
          if (!(Test-Path 'build-lsg-win\Release\meshes\human_carrier_female.rmesh')) { throw 'Female carrier RMS0 missing beside EXE' }
          if (Test-Path 'build-lsg-win\Release\meshes\human_profile_2.rmesh') { throw 'Unexpected Character 2 carrier duplicate beside EXE' }
          if (!(Test-Path 'build-lsg-win\Release\shaders\eye.vert.spv')) { throw 'eye vertex SPIR-V missing beside EXE' }
          if (!(Test-Path 'build-lsg-win\Release\shaders\eye.frag.spv')) { throw 'eye fragment SPIR-V missing beside EXE' }
          if (!(Test-Path 'build-lsg-win\Release\meshes\eye_carrier_male.rmesh')) { throw 'Male eye carrier RMS0 missing beside EXE' }
          if (!(Test-Path 'build-lsg-win\Release\meshes\eye_carrier_female.rmesh')) { throw 'Female eye carrier RMS0 missing beside EXE' }
          if (Test-Path 'build-lsg-win\Release\meshes\eye_profile_2.rmesh') { throw 'Unexpected Character 2 eye carrier duplicate beside EXE' }
          if (!(Test-Path 'build-lsg-win\Release\registry.lsgr')) { throw 'runtime registry missing beside EXE' }
          if (!(Test-Path 'build-lsg-win\Release\profiles\character_0.lsg')) { throw 'runtime profile 0 missing beside EXE' }
          if (!(Test-Path 'build-lsg-win\Release\profiles\character_1.lsg')) { throw 'runtime profile 1 missing beside EXE' }
          if (!(Test-Path 'build-lsg-win\Release\profiles\character_2.lsg')) { throw 'runtime profile 2 missing beside EXE' }
          if (!(Test-Path 'build-lsg-win\Release\lsg-acceptance-report.txt')) { throw 'storage report missing' }
          if (!(Test-Path 'build-lsg-win\Release\lsg-mesh-audit-profile-0.txt')) { throw 'Character 0 mesh continuity report missing' }
          if (!(Test-Path 'build-lsg-win\Release\lsg-mesh-audit-profile-1.txt')) { throw 'Character 1 mesh continuity report missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: rengine-lsg-windows-human-${{ github.sha }}
          path: |
            build-lsg-win/Release/rengine_lsg_viewer.exe
            build-lsg-win/Release/shaders
            build-lsg-win/Release/meshes
            build-lsg-win/Release/profiles
            build-lsg-win/Release/registry.lsgr
            build-lsg-win/Release/lsg-acceptance-report.txt
            build-lsg-win/Release/lsg-mesh-audit-profile-0.txt
            build-lsg-win/Release/lsg-mesh-audit-profile-1.txt
            build-lsg-win/Release/lsg-body-normal-seams-profile-0.txt
            build-lsg-win/Release/lsg-body-normal-seams-profile-1.txt
            build-lsg-win/lsg-eye-fit-sha256.txt
            build-lsg-win/lsg-profile-0-eye-fit-report.txt
            build-lsg-win/lsg-profile-1-eye-fit-report.txt
            build-lsg-win/lsg-eye-components-profile-0.txt
            build-lsg-win/lsg-eye-components-profile-1.txt
          if-no-files-found: error
