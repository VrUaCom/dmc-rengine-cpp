name: Deploy Discovery Site

on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - 'tools/build_discovery_site.py'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dmc-rengine-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ vars.DMC_RENGINE_ENABLE_PAGES == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Require explicit site base URL
        env:
          SITE_BASE_URL: ${{ vars.DMC_RENGINE_SITE_BASE_URL }}
        run: test -n "$SITE_BASE_URL"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build static discovery site
        env:
          SITE_BASE_URL: ${{ vars.DMC_RENGINE_SITE_BASE_URL }}
        run: python tools/build_discovery_site.py --output _site --base-url "$SITE_BASE_URL"
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: ${{ vars.DMC_RENGINE_ENABLE_PAGES == 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
