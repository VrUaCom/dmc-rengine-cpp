name: LSG Android Prototype

on:
  push:
    branches: [rengine-living-surface-genome]
    paths:
      - 'labs/lsg/**'
      - '.github/workflows/lsg-android.yml'
  pull_request:
    paths:
      - 'labs/lsg/**'
      - '.github/workflows/lsg-android.yml'

jobs:
  host-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure LSG C++23 core
        run: cmake -S labs/lsg -B build-lsg -G Ninja -DRENGINE_LSG_BUILD_VIEWER=OFF
      - name: Build LSG core
        run: cmake --build build-lsg --parallel 2
      - name: Test LSG deterministic contract
        run: ctest --test-dir build-lsg --output-on-failure

  android-arm64-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install stable Android 36, CMake and NDK r30
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'cmake;3.22.1' 'ndk;30.0.16248370'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build arm64-v8a debug APK
        run: gradle -p labs/lsg/viewer/android :app:assembleDebug --stacktrace
      - name: Verify native library packaged
        run: |
          unzip -l labs/lsg/viewer/android/app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk-files.txt
          grep 'lib/arm64-v8a/librengine_lsg.so' /tmp/apk-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rengine-lsg-android-arm64-${{ github.sha }}
          path: labs/lsg/viewer/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
