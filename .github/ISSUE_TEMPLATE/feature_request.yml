name: Feature request
description: Propose a scoped capability or architecture improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: input
    id: problem
    attributes:
      label: Problem
      description: What concrete user or engineering problem must be solved?
    validations:
      required: true
  - type: textarea
    id: use_cases
    attributes:
      label: Use cases
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: architecture
    attributes:
      label: Architecture impact
      description: Explain GDSpaces, evidence, ownership, writer, and subsystem boundaries.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Architecture confirmation
      options:
        - label: The proposal does not introduce a second resource resolver.
          required: true
        - label: The proposal does not require proprietary files in the repository.
          required: true
